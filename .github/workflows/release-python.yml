name: Release Python SDK

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag and read the changelog entry
        run: ../scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: notes, path: "${{ runner.temp }}/notes.md" }

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; attestations are added automatically
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: notes }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the GitHub release
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          prerelease=(); [[ "$version" =~ (a|b|rc|-) ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Python SDK $version" \
            --notes-file notes.md --verify-tag "${prerelease[@]}" dist/*
