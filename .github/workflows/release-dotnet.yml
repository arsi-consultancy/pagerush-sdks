name: Release .NET SDK

on:
  push:
    tags: ["dotnet-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet trusted publishing
    defaults: { run: { working-directory: dotnet } }
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and read the changelog entry
        run: ../scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - name: Run the checks
        run: |
          dotnet restore
          dotnet format --verify-no-changes --no-restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build
      - name: Pack
        run: dotnet pack src/PageRush/PageRush.csproj -c Release --no-build -o "$RUNNER_TEMP/nupkg"
      # Exchanges the job's OIDC token for a NuGet API key that is valid for one hour.
      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        env: { NUGET_API_KEY: "${{ steps.nuget.outputs.NUGET_API_KEY }}" }
        # --skip-duplicate lets a rerun of this tag, after a failure past this step, still create
        # the GitHub release. The .snupkg next to the .nupkg is pushed to the symbol server.
        run: |
          dotnet nuget push "$RUNNER_TEMP/nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          version="${GITHUB_REF_NAME#dotnet-v}"
          prerelease=(); [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title ".NET SDK $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${prerelease[@]}"
