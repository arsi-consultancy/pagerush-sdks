name: Release Node.js SDK

on:
  push:
    tags: ["node-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing; npm adds provenance automatically
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and read the changelog entry
        run: ../scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - name: Use an npm release with trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs typecheck, lint, tests and the build.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#node-v}"
          # Skip a version that is already on npm (published by hand, or by an earlier run of
          # this tag that failed after publishing) so the run can still create the GitHub release.
          if [[ "$(npm view "pagerush@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "::notice::pagerush@$version is already on npm; skipping publish."
            exit 0
          fi
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --access public --tag "$dist_tag"
      - name: Create the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          version="${GITHUB_REF_NAME#node-v}"
          prerelease=(); [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Node.js SDK $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${prerelease[@]}"
