name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testdata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make check-testdata

  node:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { node: [20, 22, 24, 26] }
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm, cache-dependency-path: node/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"] }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { php: ["8.1", "8.2", "8.3", "8.4", "8.5"] }
    defaults: { run: { working-directory: php } }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", extensions: curl, tools: composer }
      - run: composer install --no-interaction
      - run: composer check

  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { go: ["1.21", "stable"] }
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ matrix.go }}" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
