name: Release Go SDK

# Go has no registry upload: the module proxy serves the go/vX.Y.Z tag. This workflow checks the
# tag, runs the tests, asks the proxy to fetch the new version and creates the GitHub release.

on:
  push:
    tags: ["go/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and read the changelog entry
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: Run the checks
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Ask the module proxy to fetch this version
        run: |
          version="${GITHUB_REF_NAME#go/}"
          GOPROXY=https://proxy.golang.org \
            go list -m "github.com/${GITHUB_REPOSITORY}/go@${version}"
      - name: Create the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          version="${GITHUB_REF_NAME#go/v}"
          prerelease=(); [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Go SDK $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${prerelease[@]}"
